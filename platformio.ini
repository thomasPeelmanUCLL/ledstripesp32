[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Maximum upload speed for faster flashing
upload_speed = 921600
upload_protocol = esptool

monitor_speed = 115200
monitor_filters = 
    colorize
    time
    esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0

; Partition scheme for more program space
board_build.partitions = huge_app.csv

; Optimization flags
build_flags =
    -D ESP32
    -D CORE_DEBUG_LEVEL=1    ; Minimal logging for better performance
    -O3                      ; Maximum optimization
    -DBOARD_HAS_PSRAM       ; Enable PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_ESP_INT_WDT_TIMEOUT_MS=1000
    -DASYNCWEBSERVER_REGEX   ; Better web server performance
    -DCONFIG_ARDUINO_IDF_SCHEDULER_PREFER_CORE_1
    ; Memory optimization
    -DCONFIG_SPIRAM_CACHE_WORKAROUND
    -DCONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=16384
    ; Disable sleep modes
    -DCONFIG_PM_ENABLE=0
    -DCONFIG_FREERTOS_USE_TICKLESS_IDLE=0
    -DCONFIG_PM_DFS_INIT_AUTO=0
    -DCONFIG_PM_PROFILING=0
    -DCONFIG_PM_TRACE=0

; Performance build settings
build_type = release
build_unflags = 
    -Os     ; Remove default optimization
    -O2     ; Remove lower optimization level

; Additional performance settings
board_build.f_cpu = 240000000L    ; Maximum CPU frequency
board_build.f_flash = 80000000L   ; Maximum flash speed
board_build.flash_mode = qio      ; Quad IO mode for faster flash access
lib_deps = fastled/FastLED